# Load the user/permission definitions generated by the entrypoint on boot.
load_definitions = /etc/rabbitmq/definitions.json

# The management plugin (bundled in the -management image) listens on 15672.
management.tcp.port = 15672

# Deny the built-in guest account from any remote connection; only the scoped
# users provisioned via definitions.json may connect over the network.
loopback_users.guest = true
