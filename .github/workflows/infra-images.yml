name: Build Infra Images [DEV]

on:
  push:
    branches: [ dev ]
    paths:
      - 'infra/db/**'
      - 'infra/rabbitmq/**'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      rabbitmq: ${{ steps.filter.outputs.rabbitmq }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - 'infra/db/**'
            rabbitmq:
              - 'infra/rabbitmq/**'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.db == 'true' || needs.changes.outputs.rabbitmq == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db
            context: infra/db
            build: ${{ needs.changes.outputs.db }}
          - name: rabbitmq
            context: infra/rabbitmq
            build: ${{ needs.changes.outputs.rabbitmq }}
    steps:
      - name: Checkout repository
        if: ${{ matrix.build == 'true' }}
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: ${{ matrix.build == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ matrix.build == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        if: ${{ matrix.build == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fourletters-${{ matrix.name }}:dev-latest
            ghcr.io/${{ github.repository_owner }}/fourletters-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
